<html>
    <title>Functions</title>
    <head>
      <script>
        function displayFavoriteColor(color)
            {
                var favoriteColor = color;
                document.getElementById("myTag").innerHTML = "This is my NOT favorite color " + favoriteColor;
            }
    </script>
    </head>
    <body onload="displayFavoriteColor('red');">
        <span id="myTag">This is my favorite text</span>
    </body>

    
 </html>
